[project]
name = "agn-binary-lightcurves"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "astropy>=8.0.2",
    "astroquery>=0.4.11",
    "corner>=2.3.0",
    "dynesty>=3.1.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "matplotlib-inline>=0.2.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scipy>=1.18.1",
]
[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agn_analysis"